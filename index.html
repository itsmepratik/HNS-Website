<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />

    <title>HNS Precision | Advanced Engine Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Cairo', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              brand: {
                50: '#f7fee7',
                100: '#ecfccb',
                200: '#d9f99d',
                300: '#bef264',
                400: '#d5f365', // Main Green provided
                500: '#d5f365', // Mapping to 500 for consistency
                600: '#84cc16',
                700: '#4d7c0f',
                800: '#3f6212',
                900: '#365314',
                950: '#1a2e05',
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #262626 1px, transparent 1px), linear-gradient(to bottom, #262626 1px, transparent 1px)",
              'grid-pattern-light': "linear-gradient(to right, #e5e5e5 1px, transparent 1px), linear-gradient(to bottom, #e5e5e5 1px, transparent 1px)",
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      body {
        @apply bg-[#050505] text-[#fafafa];
      }
      .glass-panel {
        @apply bg-[#0a0a0a]/70 backdrop-blur-xl border border-white/10;
      }
      .glass-panel-light {
        @apply bg-white/5 backdrop-blur-md border border-white/10;
      }
      /* RTL Font overrides */
      html[dir="rtl"] {
        font-family: 'Cairo', sans-serif;
      }
    </style>
